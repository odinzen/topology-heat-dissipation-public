[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "topoheat"
version = "1.0.0"
description = "Two-way coupled thermoelastic topology optimization for heat dissipation, verified to closed form"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "Michael E. Bustamante", email = "michaelbusta@odinzen.io" }]
dependencies = [
    "numpy==2.2.6",
    "scipy==1.15.3",
    "jsonschema==4.26.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
amg = ["pyamg==5.3.0"]
figures = ["matplotlib==3.10.9"]
geometry = [
    "trimesh>=4.0",
    "scikit-image>=0.22",
    "manifold3d>=3.0",
]

[project.scripts]
topoheat = "topoheat.engine:main"

[tool.setuptools]
packages = ["topoheat"]

[tool.setuptools.package-data]
"topoheat" = ["schema/*.json"]
